support:()=>'<div class="scr">'+tp()+'<h1 class="c">We’re here to support you</h1><p class="sub c" style="font-size:15px">Tracking with Silent Shift can help you recognize patterns, so you can live more in sync with your cycle and approach healthcare appointments with confidence.</p><div class="grid" style="align-items:start"><div class="card"><b>Cycle statistics</b><div class="card" style="margin-top:10px;padding:12px"><span style="font-size:13px;color:var(--mu)">Cycle length</span><div style="font-size:22px;font-weight:700">42 days</div></div><div class="card" style="margin-top:10px;padding:12px"><span style="font-size:13px;color:var(--mu)">Cycle variation</span><div style="font-size:22px;font-weight:700">10 days</div></div></div><div class="card" style="padding:0;overflow:hidden"><img src="'+IM.S1+'" style="width:100%;height:150px;object-fit:cover;display:block" alt=""><p style="margin:0;padding:12px;font-size:14px">Tips to manage perimenopause →</p></div></div><div class="card" style="padding:0;overflow:hidden;width:calc(50% - 6px);margin-top:12px"><img src="'+IM.S2+'" style="width:100%;height:120px;object-fit:cover;display:block" alt=""><p style="margin:0;padding:12px;font-size:14px">Emotional changes: You’re not alone →</p></div>'+foot(btn('Next',"go('date')"))+'</div>',
date:()=>{const m=S.cm,y=m.getFullYear(),mo=m.getMonth(),f=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate();let c='';for(let i=0;i<f;i++)c+='<span></span>';for(let d=1;d<=n;d++){const on=S.last.getFullYear()==y&&S.last.getMonth()==mo&&S.last.getDate()==d;c+='<button class="'+(on?'on':'')+'" onclick="S.last=new Date('+y+','+mo+','+d+');draw()">'+d+'</button>'}

track:()=>{const T=S.tab==0,w=['M','T','W','T','F','S','S'],dow=(TODAY.getDay()+6)%7,mon=new Date(TODAY);mon.setDate(mon.getDate()-dow);
 const dl=TODAY.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 return '<div class="scr">'+tp(AV)+'<div class="c"><div style="font-size:20px;font-weight:700">'+dl+'</div><div style="color:var(--mu);font-size:14px">'+phase(cycleDay())+' Phase</div></div><div style="display:flex;justify-content:space-between;text-align:center;margin:12px 6px 0">'+w.map((x,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return '<div style="width:40px"><div style="font-size:13px;color:var(--mu)">'+x+'</div><div style="margin:4px auto 0;width:36px;height:36px;border-radius:50%;line-height:36px;font-size:16px;'+(i==dow?'background:var(--ac)':'')+'">'+d.getDate()+'</div></div>'}).join('')+'</div><div class="seg"><button class="'+(T?'on':'')+'" onclick="S.tab=0;draw()">Triggers</button><button class="'+(T?'':'on')+'" onclick="S.tab=1;draw()">Wellbeing</button></div><div class="body" style="padding-bottom:110px"><h2 style="font-size:24px;margin:0 0 4px;letter-spacing:-.02em">'+(T?'Track your triggers':'How are you feeling today?')+'</h2><p class="sub" style="font-size:14px;margin-bottom:6px">'+(T?'Log what might affect your symptoms today.':'Track your symptoms to understand your cycle better.')+'</p>'+(T?dotRows('trig',[['Caffeine','☕'],['Dairy consumption','🥛'],['Dietary changes','🥗'],['Fatty food','🍕'],['Meat consumption','🥩'],['Water intake','💧']]):dotRows('well',[['Acne','😣'],['Bloating','🎈'],['Breast Tenderness','💗'],['Digestive Issues','🫄'],['Hot Flushes','🌡️'],['Dizziness','💫']]))+'</div>'+foot(btn('Continue '+ic('arrow'),T?"S.tab=1;draw()":"go('daily')"))+'</div>'},
daily:()=>{const G=[['w','Water Intake','💧','Weekly on Monday','2 / 2 L','6:30 PM',100],['e','Daily Exercise','🏃','In your plan','20 / 20 min','6:30 PM',100],['m','Mindful Moment','🪷','In your plan','0 / 10 min','8:00 PM',0]];

docs:()=>'<div class="scr">'+tp(AV)+'<h1>Good morning, Janvi.</h1><p class="sub" style="font-size:15px">Hi, you want an appointment? We have direct consultations.</p><div style="display:flex;gap:10px;margin-bottom:16px"><div class="fld" style="flex:1;margin:0;height:50px"><span style="margin-right:10px;color:var(--mu)">'+ic('search',20)+'</span><input id="q" placeholder="Search doctors, specialties or symptoms" value="'+esc(S.q)+'" autocomplete="off" style="font-size:16px"></div><button class="bk card" style="width:50px;height:50px;padding:0;border-radius:50%" onclick="toast(\'Filters aren’t part of the prototype\')" aria-label="Filters">'+ic('sl',20)+'</button></div><div class="body" style="padding-bottom:'+(S.onb?'110':'120')+'px">'+DOCS.map((d,i)=>'<div class="card doc" style="'+DT[i]+'" data-k="'+d[7]+' '+d[0].toLowerCase()+'" onclick="S.doc='+i+';go(\'doc\')"><div style="flex:1"><h3>Dr. '+d[0]+'</h3><div style="font-size:13px;color:var(--mu)">Mon to Fri · 1:00 – 4:00</div><span class="chip" style="background:'+CH[i][0]+'">'+d[1]+'</span><span class="chip" style="background:'+CH[i][1]+'">'+d[2]+'</span><div style="margin-top:10px;font-size:13px">⭐ <b>'+d[3]+'</b> ('+d[4]+' reviews)</div><button class="mini" onclick="event.stopPropagation();S.doc='+i+';go(\'doc\')">Book →</button></div><div style="position:relative;flex:none;width:104px;height:128px"><img src="'+IM['D'+i]+'" alt="Dr. '+d[0]+'"><button class="hrt" aria-label="Save doctor" onclick="event.stopPropagation();S.fav['+i+']=S.fav['+i+']?0:1;draw()">'+(S.fav[i]?'♥':'♡')+'</button></div></div>').join('')+'<div id="none" class="card c" style="display:none;margin-top:6px;padding:28px 20px"><b style="font-size:19px">No doctors found</b><p class="sub" style="margin:8px 0 0;font-size:14px">Try a different name, specialty or symptom.</p></div></div>'+(S.onb?foot(btn('Continue '+ic('arrow'),"S.onb=false;go('home!')")):nav('docs'))+'</div>',
doc:()=>{const d=DOCS[S.doc],D=[['Mon','12 May'],['Tue','13 May'],['Wed','14 May'],['Thu','15 May'],['Fri','16 May']],T=['10:00 AM','11:00 AM','12:00 PM'],F='font-family:Fraunces,Georgia,serif;',

 return '<div class="scr" style="padding:0;background:#fff6f4">'+hero+'<div style="position:absolute;top:46px;left:14px;right:22px;display:flex;justify-content:space-between;align-items:center;z-index:3"><button class="bk" onclick="go(\'back\')" aria-label="Back" style="color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7))">'+ic('back',26)+'</button><div style="display:flex;gap:14px"><button onclick="S.dfav=S.dfav?0:1;draw()" aria-label="Save doctor" style="width:38px;height:38px;border-radius:50%;border:0;background:#fde4e1;color:#b04c55;display:grid;place-items:center;cursor:pointer;padding:0">'+(S.dfav?'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="'+IC.heart+'"/></svg>':ic('heart',20))+'</button><button onclick="go(\'profile\')" aria-label="Profile" style="width:38px;height:38px;border-radius:50%;border:0;background:#fde4e1;color:#4a1620;display:grid;place-items:center;cursor:pointer;padding:0">'+ic('user',20)+'</button></div></div>'+
 '<div class="dsheet" style="position:absolute;top:262px;left:0;right:0;bottom:0;background:#fff6f4;box-shadow:0 -10px 30px rgba(124,52,66,.18);border-radius:38px 38px 0 0;padding:24px 22px 0;overflow-y:auto;scrollbar-width:none"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="'+F+'font-weight:600;font-size:32px;letter-spacing:-.01em;margin:0">Dr. '+d[0]+'</h1><button class="bk" aria-label="Bookmark" onclick="S.bm=S.bm?0:1;draw()" style="width:34px;height:34px">'+(S.bm?'<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="'+IC.bm+'"/></svg>':ic('bm',24))+'</button></div><div style="font-size:16px;margin:6px 0 10px">'+d[5]+'</div><div style="display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px"><svg viewBox="0 0 24 24" width="22" height="22" fill="#f5c34b"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><b>'+d[3]+'</b><span>('+d[4]+' reviews)</span><span style="opacity:.5">|</span>'+ic('user',18)+'<span>'+d[6]+' experience</span></div><div style="display:flex;gap:8px;margin-bottom:16px">'+ch+'</div><div style="display:flex;justify-content:space-between;margin-bottom:16px">'+inf+'</div><h2 style="'+F+'font-weight:600;font-size:24px;margin:0 0 6px">About</h2><p style="font-size:15px;line-height:1.45;margin:0 0 18px">Dr. '+d[0]+' is a highly experienced gynecologist specializing in menopause care, hormonal balance, reproductive health and overall women’s wellness. She helps women navigate every stage of menopause with confidence, comfort, and personalised care.</p><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="'+F+'font-weight:600;font-size:22px;margin:0">Available Slots</h2><span style="font-size:15px">View all →</span></div><div class="sl dy">'+D.map((x,i)=>'<button class="'+(S.day==i?'on':'')+'" onclick="S.day='+i+';draw()">'+x[0]+'<br>'+x[1]+'</button>').join('')+'</div><div class="sl tm">'+T.map((x,i)=>'<button class="'+(S.slot==i?'on':'')+'" onclick="S.slot='+i+';draw()">'+x+'</button>').join('')+'</div></div>'+foot(btn((S.edit!=null?'Update Appointment ':'Book Appointment ')+ic('arrow'),"book()"))+'</div>'},

insights:()=>{const B=[[25,'29 Jul'],[28,'23 Aug'],[34,'20 Sep']],Sy=[['Fatigue',9],['Bloating',7],['Cramps',6]];
 return '<div class="scr">'+tp()+'<h1 style="margin-top:4px">Cycle Insights</h1><p class="sub" style="font-size:15px;margin-bottom:12px">Your last 3 completed cycles</p><div class="body" style="padding-bottom:130px"><div class="card"><b style="font-size:18px">Cycle length</b><p style="margin:2px 0 0;font-size:13px;color:var(--mu)">Days from one period start to the next</p><div style="display:flex;gap:12px;align-items:flex-end;height:170px;margin-top:8px;border-bottom:1px solid var(--gb)">'+B.map((b,i)=>'<div style="flex:1;text-align:center"><b style="color:'+(i==2?'var(--ac)':'var(--tx)')+'">'+b[0]+'</b><div class="gbar" style="height:'+b[0]/34*110+'px;border-radius:12px 12px 0 0;margin-top:4px;background:'+['linear-gradient(#5fe0cf,#27a595)','linear-gradient(#ffd37a,#ff9a4d)','linear-gradient(#ff9fb0,#ec4f7e)'][i]+'"></div></div>').join('')+'</div><div style="display:flex;gap:12px;text-align:center;font-size:13px;margin-top:8px;color:var(--mu)">'+B.map(b=>'<span style="flex:1">'+b[1]+'</span>').join('')+'</div></div><div style="display:flex;gap:10px;margin:12px 0">'+[['Shortest','25 days'],['Longest','34 days'],['Difference','9 days']].map((x,i)=>'<div class="card" style="flex:1;padding:12px;'+['background:linear-gradient(135deg,rgba(63,193,176,.32),rgba(63,193,176,.08))','background:linear-gradient(135deg,rgba(255,201,77,.32),rgba(255,201,77,.08))','background:#e0566f;color:#fff'][i]+'"><span style="font-size:12px;opacity:.7">'+x[0]+'</span><div style="font-weight:700;font-size:17px">'+x[1]+'</div></div>').join('')+'</div><div class="card"><b style="font-size:18px">Symptoms you logged most</b>'+Sy.map((s,si)=>'<div style="display:flex;align-items:center;gap:12px;margin-top:14px;font-size:14px"><span style="width:62px">'+s[0]+'</span><div class="bar"><i style="width:'+s[1]*10+'%;background:'+BARS[si]+'"></i></div><span style="width:50px;text-align:right">'+s[1]+' days</span></div>').join('')+'</div><div class="card" style="margin-top:12px;background:linear-gradient
